name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libx11-6 libice6 libsm6 libfontconfig1
      - name: Restore
        run: dotnet restore PromptManager.slnx
      - name: Build
        run: dotnet build PromptManager.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test PromptManager.UnitTests/PromptManager.UnitTests.csproj --configuration Release --no-build --verbosity normal
